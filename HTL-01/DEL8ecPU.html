<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer"><title>道案内 — ホテル本館</title>
<style>
:root{--bg:#f7f7f5;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#e2e1dc;--acc:#2f5d8a;--warn:#8a6100;--warnbg:#fff4d6}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecebe6;--mut:#a3a29c;--card:#1f1f1d;--line:#34332f;--acc:#8ab4e0;--warn:#ffd27a;--warnbg:#3a2f12}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}h1{font-size:1.2rem;margin:.2rem 0 .8rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.mut{color:var(--mut);font-size:.9rem}.warn{background:var(--warnbg);color:var(--warn);font-weight:600}
.body{white-space:pre-wrap}a.btn{display:block;text-align:center;background:var(--acc);color:var(--card);padding:12px;border-radius:10px;text-decoration:none;font-weight:600;margin-bottom:10px}
</style></head><body><main>
<h1>ホテル本館への道案内</h1>
<div class="card"><div class="mut">現在地</div><div>ホテル本館ロビーにいる</div><div class="mut">移動手段・所要目安</div><div>徒歩（約4分 (280m)）</div>
<div class="mut">目的地</div><div>コインランドリー</div></div>

<div class="card body">当館正面玄関を出て、【左手（下り坂方向）】へお進みください。急な下り坂となっておりますのでお足元にご注意ください。
坂を下りきった交差点（正面にベーカリー）を右折し、約80m直進しますと、左手青い看板の『コインランドリー24（年中無休・スニーカー洗濯機あり）』がございます。両替機・洗剤自動投入完備です。</div>

<p class="mut">道がご不明な際は、当館代表へお電話ください。</p>
<p class="mut">このページは ホテル本館 が道案内のために作成したものです。</p>
</main></body></html>
